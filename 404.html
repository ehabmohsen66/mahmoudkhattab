<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Страница не найдена — Махмуд Хаттаб</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --nile:#087ea4; --nile-deep:#075b78; --ink:#17242b; --muted:#4e6068;
            --paper:#fffdf7; --line:#d7e7eb; }
    * { box-sizing: border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
           font:16px/1.65 "DM Sans", system-ui, sans-serif; color:var(--ink);
           background:
             radial-gradient(circle at 12% 8%, rgba(8,126,164,.10), transparent 34%),
             radial-gradient(circle at 88% 4%, rgba(255,183,3,.12), transparent 30%),
             var(--paper); }
    .card { max-width:560px; text-align:center; }
    .code { font-size:clamp(64px,16vw,110px); font-weight:800; line-height:1;
            letter-spacing:-.04em; color:var(--nile); margin:0 0 6px; }
    h1 { font-size:clamp(22px,4.5vw,30px); margin:0 0 12px; letter-spacing:-.01em }
    p  { color:var(--muted); margin:0 0 26px }
    .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:48px;
        padding:0 22px; border-radius:12px; text-decoration:none; font-weight:700; }
    .primary { background:var(--nile); color:#fff }
    .primary:hover { background:var(--nile-deep) }
    .ghost { border:1px solid var(--line); color:var(--ink); background:#fff }
    .wa { background:#25d366; color:#fff }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела. Вернитесь на главную — или просто напишите мне,
       и я отвечу лично.</p>
    <div class="row">
      <a class="primary" href="/">На главную</a>
      <a class="wa" href="https://wa.me/201009686874">WhatsApp</a>
      <a class="ghost" href="/#gallery">Галерея</a>
    </div>
  </div>
</body>
</html>
